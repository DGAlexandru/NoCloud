name: Release
on:
  release:
    types:
      - published
jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by softprops/action-gh-release@v3
    strategy:
      matrix:
        node-version:
          - 22.x
    steps:
      - uses: actions/checkout@v6
      - name: 'Use Node.js ${{ matrix.node-version }}'
        uses: actions/setup-node@v6
        with:
          node-version: '${{ matrix.node-version }}'
      - name: Install NPM
        run: npm ci
      - name: Generate OpenAPI Docs
        run: npm run build_openapi_schema
      - name: Build NoCloud frontend
        run: npm run build --workspace=frontend
      - name: Build NoCloud armv7
        run: npm run build_armv7 --workspace=backend
      - name: Build NoCloud armv7 lowmem
        run: npm run build_armv7_lowmem --workspace=backend
      - name: Build NoCloud aarch64
        run: npm run build_aarch64 --workspace=backend
      - name: UPX-compress NoCloud binaries
        run: npm run upx
      - name: Generate manifest
        run: npm run build_release_manifest

      # Asset names must match the manifest keys (see util/build_release_manifest.js "binaries")
      # — the app's updater resolves binaries by these exact names.
      - name: Stage release assets with app-expected names
        run: |
          mv ./build/armv7/NoCloud            ./build/NoCloud-armv7
          mv ./build/armv7/NoCloud-lowmem     ./build/NoCloud-armv7-lowmem
          mv ./build/aarch64/NoCloud          ./build/NoCloud-aarch64
          mv ./build/armv7/NoCloud.upx        ./build/NoCloud-armv7.upx
          mv ./build/armv7/NoCloud-lowmem.upx ./build/NoCloud-armv7-lowmem.upx
          mv ./build/aarch64/NoCloud.upx      ./build/NoCloud-aarch64.upx

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./build/NoCloud-armv7
            ./build/NoCloud-armv7-lowmem
            ./build/NoCloud-aarch64
            ./build/NoCloud-armv7.upx
            ./build/NoCloud-armv7-lowmem.upx
            ./build/NoCloud-aarch64.upx
            ./build/NoCloud_release_manifest.json
            ./build/NoCloud.openapi.schema.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
